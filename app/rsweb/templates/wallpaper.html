<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Replicant Space wallpaper</title>
<link rel="stylesheet" href="{{ base }}/static/app.css">
<style>
  /* full-screen, no chrome: this page is a desktop background (Octos) */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070c; user-select: none; }
  [hidden] { display: none !important; }
  #map { position: fixed; inset: 0; width: auto; height: auto; min-height: 0; border: 0; border-radius: 0; }
  #map canvas { display: block; }
  #sys { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
         background: radial-gradient(circle at center, #121a2b 0%, #05070c 72%); }
  #sys svg.system { width: min(100vw, 100vh); height: min(100vw, 100vh); max-width: none; border: 0; border-radius: 0; background: none; }
  #caption { position: fixed; left: 24px; bottom: 20px; font: 600 15px/1.3 var(--mono, monospace); color: #9fb3d1;
             letter-spacing: .06em; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #caption small { display: block; font-weight: 400; font-size: 11px; color: #6c7b95; letter-spacing: 0; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #9fb3d1;
         font: 15px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; }
  #msg b { color: #e3e9f5; }
  .wp-note { color: #6c7b95; font: 13px system-ui, sans-serif; }
</style>
<script type="importmap">{"imports": {"three": "{{ base }}/static/vendor/three.module.min.js",
                                      "three/addons/OrbitControls.js": "{{ base }}/static/vendor/OrbitControls.js"}}</script>
</head>
<body>
<div id="map" hidden></div>
<div id="sys" hidden></div>
<div id="caption"></div>
<div id="msg" hidden></div>
<script src="{{ base }}/static/movers.js"></script>
<script type="module" src="{{ base }}/static/wallpaper.js"></script>
</body>
</html>
