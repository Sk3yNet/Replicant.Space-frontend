{# Travel destination: pick a system (yours, explored, unexplored — nearest first), then a spot in it; or type a code.
   Sends {{ key }}__star (the system), {{ key }} (the spot; blank = the system / its entry point) and {{ key }}__custom (typed). #}
<div class="row">
  <select name="{{ key }}__star" hx-get="/print-queue/locations" hx-trigger="change" hx-target="next select" hx-swap="innerHTML"
          hx-vals='js:{dest_star: event.target.value}' title="system">
    <option value="">— system —</option>
    {% for g in ["Your systems", "Explored", "Unexplored"] %}{% set opts = systems | selectattr("group", "equalto", g) | list %}
      {% if opts %}<optgroup label="{{ g }}">{% for o in opts %}<option value="{{ o.value }}">{{ o.value }}{% if o.label %} · {{ o.label }}{% endif %}</option>{% endfor %}</optgroup>{% endif %}
    {% endfor %}
  </select>
  <select name="{{ key }}" title="where in that system"><option value="">— system first —</option></select>
  <input name="{{ key }}__custom" placeholder="or type a code" size="16" {% if list_id %}list="{{ list_id }}"{% endif %} autocomplete="off"
         title="overrides the lists, e.g. FALQUORYX-3-2 or ITHVALAI-BELT-1">
</div>
