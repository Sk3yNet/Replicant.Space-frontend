# Replicant Space web client
#
#   Internet ─► Cloudflare ─► cloudflared ─► nginx ─(auth_request)─► oauth2-proxy (Google)
#                                              │
#                                              └─► app (FastAPI + htmx, SQLite, holds the game token)
#
# No host ports are published: the tunnel is the only way in.
# Portainer: Stacks ▸ Add stack ▸ Repository (point at this repo), then fill in the
# environment variables listed in .env.example. Nothing secret lives in the repo.

name: replicant-web

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?set CF_TUNNEL_TOKEN}
    depends_on: [nginx]
    restart: unless-stopped
    networks: [edge]

  nginx:
    build: ./nginx
    image: replicant-web-nginx:latest
    depends_on: [oauth2-proxy, app]
    restart: unless-stopped
    networks: [edge]
    # Uncomment for LAN debugging (login still redirects to PUBLIC_HOST):
    # ports: ["8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Writes the oauth2-proxy allow-list from ALLOWED_EMAIL, then exits.
  # (Portainer's bundled Compose is too old for inline `configs: content:`.)
  auth-config:
    image: busybox:1.36
    environment:
      ALLOWED_EMAIL: ${ALLOWED_EMAIL:?set ALLOWED_EMAIL}
    command: ["sh", "-c", "printf '%s\\n' \"$$ALLOWED_EMAIL\" | tr ',' '\\n' > /cfg/emails.txt && cat /cfg/emails.txt"]
    volumes:
      - oauth2-config:/cfg
    restart: "no"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    depends_on:
      auth-config:
        condition: service_completed_successfully
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?set OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://${PUBLIC_HOST:?set PUBLIC_HOST}/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${PUBLIC_HOST}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      # Only the Google account(s) in this file may sign in.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/emails.txt
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    volumes:
      - oauth2-config:/etc/oauth2-proxy:ro
    restart: unless-stopped
    networks: [edge]

  app:
    build: ./app
    image: replicant-web-app:latest
    environment:
      RS_API_TOKEN: ${RS_API_TOKEN:?set RS_API_TOKEN}
      RS_API_BASE: ${RS_API_BASE:-https://api.replicant.space/v1}
      DB_PATH: /data/rsweb.sqlite
      ALLOWED_EMAILS: ${ALLOWED_EMAIL:?set ALLOWED_EMAIL}
      TZ: ${TZ:-America/New_York}
    volumes:
      - rsweb-data:/data
    restart: unless-stopped
    networks: [edge]

volumes:
  rsweb-data:
  oauth2-config:

networks:
  edge:
