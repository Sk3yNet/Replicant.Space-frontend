# Replicant Space web client: one app server per Google account (multi-user mode, the default stack).
# For the older single-user stack (one server, your key only), use docker-compose.single.yml instead.
#
#   Internet ─► Cloudflare ─► cloudflared ─► nginx ─(auth_request)─► oauth2-proxy (Google: who are you?)
#                                              │
#                                              ├─(auth_request)─► manager (which server is yours?)
#                                              └─► app:<your port>  (your own copy: your token, your SQLite, your automations)
#
# The `app` container runs the manager on :8000, and it starts one app server per user on :8100, :8101 …
# Users sign in with Google, follow the walkthrough at /_tenant/ to get a game API key, and paste it there.
# The owner (OWNER_EMAIL, else the first address in ALLOWED_EMAIL) keeps the stack's RS_API_TOKEN and the existing
# database, so a stack that used the single-user file switches over on its next redeploy without losing anything.
# README › Multi-user mode has the walkthrough.

name: replicant-web

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?set CF_TUNNEL_TOKEN}
    depends_on: [nginx]
    restart: unless-stopped
    networks: [edge]

  nginx:
    build:
      context: ./nginx
      args:
        NGINX_CONF: multi.conf
    pull_policy: build
    depends_on: [oauth2-proxy, app]
    restart: unless-stopped
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?set OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://${PUBLIC_HOST:?set PUBLIC_HOST}/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${PUBLIC_HOST}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      # Google identifies everyone; the manager decides who may sign up (OWNER_EMAIL, ALLOWED_EMAIL,
      # ALLOWED_DOMAINS, OPEN_SIGNUP) and shows everyone else a "not on the list" page.
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    restart: unless-stopped
    networks: [edge]

  app:
    build: ./app
    pull_policy: build
    command: ["python", "-m", "rsweb.tenants"]
    environment:
      # Empty = the first address in ALLOWED_EMAIL.
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      # Optional: the owner's own game key. Leave empty to add it through the walkthrough like everyone else.
      RS_API_TOKEN: ${RS_API_TOKEN:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAIL:-}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      OPEN_SIGNUP: ${OPEN_SIGNUP:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      MAX_TENANTS: ${MAX_TENANTS:-10}
      RS_API_BASE: ${RS_API_BASE:-https://api.replicant.space/v1}
      DB_PATH: /data/rsweb.sqlite
      TZ: ${TZ:-America/New_York}
    volumes:
      - rsweb-data:/data
    # Each user's server gets SIGTERM and a few seconds to record a clean stop.
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [edge]

volumes:
  rsweb-data:

networks:
  edge:
