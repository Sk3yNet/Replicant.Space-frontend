# nginx in front of the app: every request must carry a valid oauth2-proxy session.
# cloudflared connects here over plain HTTP; Cloudflare terminates TLS at the edge.

# Resolve container names lazily so nginx starts even if app/oauth2-proxy are still booting.
resolver 127.0.0.11 valid=10s ipv6=off;

# Real client IP from Cloudflare (cloudflared is on the private Docker network).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

# Desktop wallpaper requests: a wallpaper refreshes every few minutes, so this is generous.
limit_req_zone $binary_remote_addr zone=wallpaper:1m rate=60r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    set $oauth2 oauth2-proxy:4180;
    set $app    app:8000;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Unauthenticated liveness check for Docker/Portainer (does not touch the app).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # oauth2-proxy's own endpoints: sign_in, callback, sign_out.
    location /oauth2/ {
        proxy_pass http://$oauth2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    # Sub-request used by auth_request below.
    location = /oauth2/auth {
        internal;
        proxy_pass http://$oauth2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # Live updates (Server-Sent Events): no buffering, long timeouts.
    # The app sends a comment every 20 s so Cloudflare's ~100 s idle timeout never fires.
    location /live/ {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        auth_request_set $auth_user  $upstream_http_x_auth_request_user;

        proxy_pass http://$app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header X-Auth-Request-User  $auth_user;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # Desktop wallpaper (Octos add-on, app/rsweb/wallpaper.py): no Google sign-in here; the app checks a revocable,
    # read-only wallpaper key instead. GET only, no identity header gets through, and framing is allowed (the add-on
    # shows the page in a frame), which is why this block sets its own headers instead of inheriting X-Frame-Options.
    location ^~ /wallpaper/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=wallpaper burst=40 nodelay;
        proxy_pass http://$app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-User "";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        proxy_read_timeout 60s;
    }

    # Everything else: the app.
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        auth_request_set $auth_user  $upstream_http_x_auth_request_user;
        # Keep oauth2-proxy's refreshed session cookie.
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        proxy_pass http://$app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Overwrites anything a client might try to send itself.
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header X-Auth-Request-User  $auth_user;
        proxy_read_timeout 120s;
    }

    # htmx requests get a 401 + HX-Redirect so the whole page goes to sign-in, not a fragment swap.
    location @signin {
        if ($http_hx_request) {
            add_header HX-Redirect "/oauth2/sign_in?rd=/" always;
            return 401;
        }
        return 302 /oauth2/sign_in?rd=$request_uri;
    }
}
