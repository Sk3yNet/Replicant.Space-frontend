# nginx for multi-user mode (docker-compose.yml): every Google account gets its own app server.
#
#   browser ─► :80  oauth2-proxy check (who are you?) ──► :8081 manager check (which server is yours?) ──► app:<port>
#                    │                                         │
#                    └ /_tenant/* ─► manager (sign-up walkthrough, key, status)
#                                                              └ no server yet ─► redirect to /_tenant/
#
# nginx allows one auth_request per location, so the two checks are two hops: the public server (:80) signs the user
# in and passes their email on; the loopback-only server (:8081) asks the manager which port serves that email.

resolver 127.0.0.11 valid=10s ipv6=off;

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=wallpaper:1m rate=60r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    set $oauth2 oauth2-proxy:4180;
    set $mgr    app:8000;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /oauth2/ {
        proxy_pass http://$oauth2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://$oauth2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # The routing answer is for nginx only.
    location = /_tenant/route {
        return 404;
    }

    location = /_tenant/wallpaper-route {
        return 404;
    }

    # Sign-up walkthrough, API key, server status, admin: always the manager, whether or not the user has a server.
    location /_tenant/ {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        proxy_pass http://$mgr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_read_timeout 60s;
    }

    # Desktop wallpaper (Octos add-on): no Google sign-in; /wallpaper/<slug>/ goes to the server of the user with that
    # slug (the manager answers which port), whose app then checks the wallpaper key. GET only, no identity header,
    # framing allowed. An unknown or stopped slug is a plain 404.
    location ~ ^/wallpaper/(?<wp_slug>[a-z0-9-]+)/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=wallpaper burst=40 nodelay;
        auth_request /_wproute;
        error_page 401 403 = @wpnone;
        auth_request_set $tenant_port $upstream_http_x_tenant_port;
        proxy_pass http://app:$tenant_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Email "";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        proxy_read_timeout 60s;
    }

    location = /_wproute {
        internal;
        proxy_pass http://$mgr/_tenant/wallpaper-route;
        proxy_set_header X-Wallpaper-Slug $wp_slug;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location @wpnone {
        return 404;
    }

    # Live updates (SSE): no buffering on either hop.
    location /live/ {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrites anything a client might try to send itself.
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_read_timeout 120s;
    }

    location @signin {
        if ($http_hx_request) {
            add_header HX-Redirect "/oauth2/sign_in?rd=/" always;
            return 401;
        }
        return 302 /oauth2/sign_in?rd=$request_uri;
    }
}

# Second hop, loopback only: route the signed-in user (email set by the server above) to their own app server.
server {
    listen 127.0.0.1:8081;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 1m;

    set $mgr app:8000;

    location = /_route {
        internal;
        proxy_pass http://$mgr/_tenant/route;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location /live/ {
        auth_request /_route;
        error_page 401 403 = @setup;
        auth_request_set $tenant_port $upstream_http_x_tenant_port;

        proxy_pass http://app:$tenant_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        auth_request /_route;
        error_page 401 403 = @setup;
        auth_request_set $tenant_port $upstream_http_x_tenant_port;

        proxy_pass http://app:$tenant_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_read_timeout 120s;
    }

    # No server yet (or it's starting): the walkthrough / status page. htmx gets a full-page redirect.
    location @setup {
        if ($http_hx_request) {
            add_header HX-Redirect "/_tenant/" always;
            return 401;
        }
        return 302 /_tenant/;
    }
}
